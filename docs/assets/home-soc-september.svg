<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">September lab: logical roles</title><desc id="desc">The switch connects the Kali Pi and management interface. The Ubuntu monitoring hub contains Wazuh, Pi-hole, Suricata and Zeek. Capture-feed and event-collection paths need verification. This is not an exact wiring map.</desc><rect x="0" y="0" width="980" height="590" rx="12" fill="#ffffff" /><defs><marker id="known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581" /></marker><marker id="pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c6500" /></marker></defs><text x="28" y="36" fill="#172b4d" font-size="24" text-anchor="start" font-weight="700"><tspan x="28" dy="0">September lab: logical roles</tspan></text><rect x="280" y="148" width="465" height="350" rx="12" fill="#f7fafc" stroke="#a6b6c8" stroke-width="1.5" /><text x="300" y="177" fill="#172b4d" font-size="20" text-anchor="start" font-weight="700"><tspan x="300" dy="0">Ubuntu monitoring Pi / NVMe</tspan></text><polyline points="220,242 310,242" fill="none" stroke="#486581" stroke-width="2.5" stroke-linejoin="round" /><polyline points="130,278 130,367" fill="none" stroke="#486581" stroke-width="2.5" stroke-linejoin="round" /><polyline points="395,274 395,331" fill="none" stroke="#486581" stroke-width="2.5" stroke-linejoin="round" /><polyline points="395,242 490,242 490,448 480,448" fill="none" stroke="#486581" stroke-width="2.5" stroke-linejoin="round" /><polyline points="590,140 590,210" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="590,274 590,331" fill="none" stroke="#486581" stroke-width="2.5" stroke-linejoin="round" /><polyline points="590,395 590,448 480,448" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="780,448 480,448" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><rect x="40" y="206" width="180" height="72" rx="8" fill="#edf4fb" stroke="#829ab1" stroke-width="1.5" /><text x="130.0" y="248.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="130.0" dy="0">Switch</tspan></text><rect x="40" y="367" width="180" height="100" rx="8" fill="#edf4fb" stroke="#829ab1" stroke-width="1.5" /><text x="130.0" y="411.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="130.0" dy="0">Headless Kali Pi</tspan><tspan x="130.0" dy="24">NVMe / SSH</tspan></text><rect x="310" y="210" width="170" height="64" rx="8" fill="#edf4fb" stroke="#829ab1" stroke-width="1.5" /><text x="395.0" y="236.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="395.0" dy="0">Management</tspan><tspan x="395.0" dy="24">interface</tspan></text><rect x="505" y="210" width="205" height="64" rx="8" fill="#edf4fb" stroke="#829ab1" stroke-width="1.5" /><text x="607.5" y="248.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="607.5" dy="0">Capture interface</tspan></text><rect x="310" y="331" width="170" height="64" rx="8" fill="#edf4fb" stroke="#829ab1" stroke-width="1.5" /><text x="395.0" y="369.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="395.0" dy="0">Pi-hole</tspan></text><rect x="505" y="331" width="205" height="64" rx="8" fill="#edf4fb" stroke="#829ab1" stroke-width="1.5" /><text x="607.5" y="369.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="607.5" dy="0">Suricata / Zeek</tspan></text><rect x="310" y="416" width="170" height="64" rx="8" fill="#edf4fb" stroke="#829ab1" stroke-width="1.5" /><text x="395.0" y="454.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="395.0" dy="0">Wazuh</tspan></text><rect x="415" y="78" width="350" height="62" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="590.0" y="103.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="590.0" dy="0">Capture feed source</tspan><tspan x="590.0" dy="24">not recorded</tspan></text><rect x="780" y="402" width="175" height="92" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="867.5" y="430.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="867.5" dy="0">Windows test</tspan><tspan x="867.5" dy="24">endpoint</tspan><tspan x="867.5" dy="24">reported</tspan></text><text x="775" y="359" fill="#9c6500" font-size="16" text-anchor="start" font-weight="400"><tspan x="775" dy="0">Event route</tspan><tspan x="775" dy="24">to verify</tspan></text><text x="535" y="417" fill="#9c6500" font-size="16" text-anchor="start" font-weight="400"><tspan x="535" dy="0">Log route: verify</tspan></text><text x="28" y="546" fill="#172b4d" font-size="17" text-anchor="start" font-weight="400"><tspan x="28" dy="0">Solid: documented roles   |   Dashed: collection path to verify</tspan></text><text x="28" y="571" fill="#52677c" font-size="16" text-anchor="start" font-weight="400"><tspan x="28" dy="0">Exact cabling, component placement, and current service health still need checking.</tspan></text></svg>