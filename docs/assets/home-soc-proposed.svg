<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 655" width="980" height="655" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">Ubiquiti additions: proposed layout</title><desc id="desc">All connections are proposed. Internet would connect to the reported Ubiquiti gateway and switch. The switch would connect to the U7 Pro access point and lab management segment. The AP would serve a planned IoT segment. Mirroring to the hub capture interface depends on verified switch support.</desc><rect x="0" y="0" width="980" height="655" rx="12" fill="#ffffff" /><defs><marker id="known" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581" /></marker><marker id="pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9c6500" /></marker></defs><text x="28" y="36" fill="#172b4d" font-size="24" text-anchor="start" font-weight="700"><tspan x="28" dy="0">Ubiquiti additions: proposed layout</tspan></text><polyline points="490,125 490,158" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="490,220 490,262" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="400,295 195,295 195,368" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="490,324 490,368" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="580,295 940,295 940,528 910,528" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="195,440 195,492" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><polyline points="490,440 490,492" fill="none" stroke="#9c6500" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#pending)" /><rect x="400" y="69" width="180" height="56" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="490.0" y="103.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">Internet</tspan></text><rect x="365" y="158" width="250" height="62" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="490.0" y="183.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">Ubiquiti gateway</tspan><tspan x="490.0" dy="24">reported addition</tspan></text><rect x="365" y="262" width="250" height="62" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="490.0" y="287.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">Ubiquiti switch</tspan><tspan x="490.0" dy="24">reported addition</tspan></text><rect x="75" y="368" width="240" height="72" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="195.0" y="398.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="195.0" dy="0">Lab / management</tspan><tspan x="195.0" dy="24">segment: planned</tspan></text><rect x="375" y="368" width="230" height="72" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="490.0" y="398.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">U7 Pro AP</tspan><tspan x="490.0" dy="24">reported addition</tspan></text><rect x="75" y="492" width="240" height="72" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="195.0" y="522.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="195.0" dy="0">Hub management</tspan><tspan x="195.0" dy="24">interface</tspan></text><rect x="375" y="492" width="230" height="72" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="490.0" y="522.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="490.0" dy="0">IoT segment</tspan><tspan x="490.0" dy="24">planned</tspan></text><rect x="680" y="492" width="230" height="72" rx="8" fill="#fff8e8" stroke="#b98928" stroke-width="1.5" /><text x="795.0" y="522.0" fill="#172b4d" font-size="18" text-anchor="middle" font-weight="400"><tspan x="795.0" dy="0">Hub capture</tspan><tspan x="795.0" dy="24">interface</tspan></text><text x="655" y="358" fill="#9c6500" font-size="16" text-anchor="start" font-weight="400"><tspan x="655" dy="0">Mirror selected lab / IoT traffic</tspan><tspan x="655" dy="24">if switch support is verified</tspan></text><text x="28" y="612" fill="#172b4d" font-size="16" text-anchor="start" font-weight="400"><tspan x="28" dy="0">All dashed connections are proposals; cabling, segmentation, and mirror settings need checking.</tspan></text><text x="28" y="637" fill="#52677c" font-size="16" text-anchor="start" font-weight="400"><tspan x="28" dy="0">A mirror may miss same-switch or same-AP traffic. Check both directions and record blind spots.</tspan></text></svg>