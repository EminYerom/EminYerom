  <polyline points="395,252 490,252 490,443 480,443" fill="none" stroke="#5f7e96" stroke-width="2.5" stroke-linejoin="round" />
  <polyline points="607,143 607,220" fill="none" stroke="#26866f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)" />
  <polyline points="607,284 607,331" fill="none" stroke="#26866f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)" />
  <polyline points="780,443 480,443" fill="none" stroke="#26866f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow)" />
