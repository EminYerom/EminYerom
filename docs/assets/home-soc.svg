  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#26866f" />
    </marker>
  </defs>
  <text x="28" y="36" fill="#15344d" font-size="25" text-anchor="start" font-weight="700">
    <tspan x="28" dy="0">Raspberry Pi monitoring lab</tspan>
  </text>
  <text x="28" y="66" fill="#537087" font-size="17" text-anchor="start" font-weight="400">
    <tspan x="28" dy="0">Separate roles for management, packet capture, and endpoint events</tspan>
  </text>
  <rect x="280" y="158" width="465" height="330" rx="12" fill="#f7fafc" stroke="#a8bccb" stroke-width="1.5" />
  <text x="300" y="189" fill="#15344d" font-size="20" text-anchor="start" font-weight="700">
    <tspan x="300" dy="0">Ubuntu monitoring Pi / NVMe</tspan>
  </text>
