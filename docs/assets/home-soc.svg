<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Raspberry Pi monitoring lab</title>
  <desc id="desc">Logical view of the lab build. A switch connects the headless Kali Pi and Ubuntu hub management interface. A separate capture interface connects to Suricata and Zeek. The hub also hosts Wazuh and Pi-hole, and receives Windows endpoint events. No private addresses or exact port assignments are shown.</desc>
